name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tk, ffmpeg and a virtual display (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb python3-tk tk tcl
          # setup-python's _tkinter is linked to Tcl/Tk 8.6. Keep those
          # libraries present even when the distro's default Tk is 9.
          sudo apt-get install -y libtk8.6 libtcl8.6 || true
          # requirements.txt installs PyGObject on Linux only, from source
          # (no wheels). 3.50+ links girepository-2.0 (glib 2.80) and cairo.
          # The Ayatana typelib is what the tray imports at runtime.
          sudo apt-get install -y gcc pkg-config python3-dev libcairo2-dev \
            libgirepository-2.0-dev gobject-introspection \
            gir1.2-ayatanaappindicator3-0.1

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey exits 0 when the community feed 504s ("installed 0/0
          # packages"), so this step can be green with ffmpeg still missing.
          # Retry, then require ffmpeg -version. A missing command does not
          # update $LASTEXITCODE, so look it up before running it.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $ok = $false
          foreach ($attempt in 1..3) {
            choco install ffmpeg -y --no-progress
            $machine = [System.Environment]::GetEnvironmentVariable('Path','Machine')
            $user = [System.Environment]::GetEnvironmentVariable('Path','User')
            $env:Path = (@($env:Path, $machine, $user) | Where-Object { $_ }) -join ';'
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              & ffmpeg -version
              if ($LASTEXITCODE -eq 0) {
                Write-Host "ffmpeg runs"
                $ok = $true
                break
              }
            }
            Write-Host "ffmpeg is not runnable (attempt $attempt of 3)"
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          if (-not $ok) { exit 1 }

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Require a working Tkinter (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter; r=tkinter.Tk(); r.update(); print('tkinter', r.tk.call('info','patchlevel')); r.destroy()"

      - name: Require a working Tkinter (Windows)
        if: runner.os == 'Windows'
        run: python -c "import tkinter; r=tkinter.Tk(); r.update(); print('tkinter', r.tk.call('info','patchlevel')); r.destroy()"

      - name: Run tests (Ubuntu, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t .

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
