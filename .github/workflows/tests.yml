name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tk, ffmpeg and a virtual display (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb python3-tk tk tcl
          # setup-python's _tkinter is linked to Tcl/Tk 8.6. Keep those
          # libraries present even when the distro's default Tk is 9.
          sudo apt-get install -y libtk8.6 libtcl8.6 || true

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Require a working Tkinter (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter; r=tkinter.Tk(); r.update(); print('tkinter', r.tk.call('info','patchlevel')); r.destroy()"

      - name: Require a working Tkinter (Windows)
        if: runner.os == 'Windows'
        run: python -c "import tkinter; r=tkinter.Tk(); r.update(); print('tkinter', r.tk.call('info','patchlevel')); r.destroy()"

      - name: Run tests (Ubuntu, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t .

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
